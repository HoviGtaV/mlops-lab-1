services:
  mlflow:
    build: ./mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/mlflow-data/mlflow.db
      - ./mlartifacts:/mlflow-data/mlartifacts

  inference:
    build: .
    # depends_on only waits for the mlflow container to start, not for the server
    # to accept connections; if the model can't be loaded yet, try again.
    restart: on-failure
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - mlflow

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      INFERENCE_URL: http://inference:8000
    depends_on:
      - inference