[project]
name = "mlops-lab-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HoviGtaV", email = "hovig.madjarian@net.usj.edu.lb" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "mlflow",
    "pillow>=12.3.0",
    "python-multipart",
    "torch",
    "torchvision",
    "uvicorn",
]

[project.scripts]
mlops-lab-1 = "mlops_lab_1:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }